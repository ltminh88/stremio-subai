# Giữ Render free-tier không "ngủ": ping manifest mỗi ~12 phút.
# Chạy trên GitHub Actions -> KHÔNG cần bật máy tính.
# Set 1 lần: Repo Settings > Secrets and variables > Actions > Variables
#   -> RENDER_URL = https://stremio-subai.onrender.com
name: keep-alive

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping manifest
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL chưa set -> bỏ qua ping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$RENDER_URL/manifest.json" || echo 000)
          echo "HTTP $code"
          [ "$code" = "200" ] || echo "::warning::Ping trả về $code (có thể đang cold-start)"
